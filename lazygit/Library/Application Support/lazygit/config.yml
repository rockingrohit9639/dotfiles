# macOS lazygit reads its config from ~/Library/Application Support/lazygit
# unless XDG_CONFIG_HOME is set, so this package stows into that path.
os:
  # 'e' (edit) hands the file to the Neovim instance lazygit is running inside.
  editPreset: nvim-remote
  # 'o' (open) defaults to macOS `open`, which hands source files to whatever
  # app owns the filetype. Inside Neovim the terminal has $NVIM set to the
  # parent's RPC socket: hand the file to the parent, which hides the lazygit
  # float and opens it. lazygit keeps running, so <leader>lg comes back to the
  # same spot. See LazygitOpenInTab in nvim/lua/lazygit-float.lua.
  open: 'if [ -z "$NVIM" ]; then open {{filename}}; else nvim --server "$NVIM" --remote-expr "v:lua.LazygitOpenInTab(''{{filename}}'')" >/dev/null; fi'
