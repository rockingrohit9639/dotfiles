# BEGIN_KITTY_THEME
# Chalk
include current-theme.conf

# END_KITTY_THEME

# Font
font_size               14.0
font_family             MonaspiceKr Nerd Font
bold_font               auto
italic_font             auto
bold_italic_font        auto
modify_font             cell_height 120%

# Cursor
cursor                  #cccccc
cursor_shape            block
cursor_blink_interval   0

# Background — macos_traditional_fullscreen preserves compositing/transparency
background_opacity      0.90
background_blur         20
macos_traditional_fullscreen yes

# Window
window_padding_width    0
hide_window_decorations titlebar-only
macos_titlebar_color    background
active_border_color     #cccccc
inactive_border_color   #444444
draw_minimal_borders    no

# Tab bar
# Plain built-in tabs at the bottom, one per tab with its index and title.
# Set tab_bar_style to `custom` to use draw_tab() from tab_bar.py in this
# directory instead (title + tick marks + battery/time status).
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        1
tab_title_template      "{index}: {title}"
# Titles come from the shell/program and often include full paths; cap them so
# a single tab can't take over the bar. Longer titles end in an ellipsis.
tab_title_max_length    25

# Scrollback
scrollback_lines        10000

# Bell
enable_audio_bell       no
visual_bell_duration    0.0

# Performance
repaint_delay           8
input_delay             2
sync_to_monitor         yes

# Layouts
enabled_layouts         splits,grid,tall,fat,stack

# Window splits
# NOTE: directional splits only work in the `splits` layout; `grid` auto-arranges.
# --cwd=current inherits the directory of the window you split from; it relies on
# shell_integration, which is left at kitty's default of `enabled`.
map f5                  launch --cwd=current --location=hsplit
map cmd+shift+v         launch --cwd=current --location=vsplit
# Split vertically (new window to the right) — cmd+shift+plus
# Overrides kitty's default cmd+shift+= / cmd+shift+- font-size shortcuts;
# cmd+= / cmd+- (without shift) still change font size.
map cmd+shift+equal     launch --cwd=current --location=vsplit
map cmd+shift+plus      launch --cwd=current --location=vsplit
# Split horizontally (new window below) — cmd+shift+minus
map cmd+shift+minus     launch --cwd=current --location=hsplit
map cmd+shift+w         close_window

# New tabs and windows inherit the current directory too. These override
# kitty's defaults, which always start in the home directory.
map cmd+t               new_tab_with_cwd
map ctrl+shift+t        new_tab_with_cwd
map cmd+enter           new_window_with_cwd
map ctrl+shift+enter    new_window_with_cwd
map cmd+n               new_os_window_with_cwd
map ctrl+shift+n        new_os_window_with_cwd

# Navigate splits (vim-style: h left, j down, k up, l right)
map cmd+shift+h         neighboring_window left
map cmd+shift+j         neighboring_window down
map cmd+shift+k         neighboring_window up
map cmd+shift+l         neighboring_window right

# Resize splits
map cmd+ctrl+h          resize_window narrower 3
map cmd+ctrl+l          resize_window wider 3
map cmd+ctrl+k          resize_window taller 3
map cmd+ctrl+j          resize_window shorter 3

# Layout switching
map ctrl+shift+space    next_layout
map cmd+shift+g         goto_layout grid
map cmd+shift+s         goto_layout splits

# herdr pass-through
# While a herdr client is attached in a window, hand these shortcuts to herdr
# instead of kitty, so the tab/split keys above drive herdr's tabs and panes.
# A map with no action unmaps the key, which sends it on to the program.
# in_herdr is a user var set by the herdr() wrapper in .zshrc; herdr's
# matching cmd bindings live in herdr/.config/herdr/config.toml.
map --when-focus-on var:in_herdr cmd+t
map --when-focus-on var:in_herdr cmd+shift+v
map --when-focus-on var:in_herdr cmd+shift+equal
map --when-focus-on var:in_herdr cmd+shift+plus
map --when-focus-on var:in_herdr cmd+shift+minus
map --when-focus-on var:in_herdr f5
map --when-focus-on var:in_herdr cmd+shift+w
map --when-focus-on var:in_herdr cmd+shift+h
map --when-focus-on var:in_herdr cmd+shift+j
map --when-focus-on var:in_herdr cmd+shift+k
map --when-focus-on var:in_herdr cmd+shift+l
map --when-focus-on var:in_herdr cmd+ctrl+h
map --when-focus-on var:in_herdr cmd+ctrl+j
map --when-focus-on var:in_herdr cmd+ctrl+k
map --when-focus-on var:in_herdr cmd+ctrl+l
map --when-focus-on var:in_herdr cmd+1
map --when-focus-on var:in_herdr cmd+2
map --when-focus-on var:in_herdr cmd+3
map --when-focus-on var:in_herdr cmd+4
map --when-focus-on var:in_herdr cmd+5
map --when-focus-on var:in_herdr cmd+6
map --when-focus-on var:in_herdr cmd+7
map --when-focus-on var:in_herdr cmd+8
map --when-focus-on var:in_herdr cmd+9
